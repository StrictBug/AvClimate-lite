name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert lite artifacts
        run: |
          test -f webapp/frontend/data-lite/manifest.json
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest_path = Path("webapp/frontend/data-lite/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          airports = manifest.get("airports") or manifest.get("icaos") or []
          if len(airports) < 212:
              print(f"Expected 212 airports, found {len(airports)}")
              sys.exit(1)
          print(f"Lite manifest OK: {len(airports)} airports, version {manifest.get('version')}")
          PY

      - name: Prepare static site
        run: |
          mkdir -p deploy
          cp -r webapp/frontend/. deploy/
          ASSET_VERSION="${GITHUB_SHA::7}"
          sed -i "s/__ASSET_VERSION__/${ASSET_VERSION}/g" deploy/index.html
          echo "Deployed asset version: ${ASSET_VERSION}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
