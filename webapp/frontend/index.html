<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aviation climatology</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css?v=__ASSET_VERSION__">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body class="lite-mode">
  <div class="loading-overlay hidden" id="loading-overlay" role="status" aria-live="polite">
    <div class="loading-card">
      <div class="loading-title">Loading data</div>
      <div class="loading-bar-track">
        <div class="loading-bar-fill" id="loading-bar-fill"></div>
      </div>
      <div class="loading-status" id="loading-status">Preparing charts...</div>
    </div>
  </div>

  <div class="info-overlay hidden" id="info-overlay" aria-hidden="true">
    <div class="info-card" role="dialog" aria-modal="true" aria-labelledby="info-title">
      <button id="info-close-btn" class="info-close-btn" type="button" aria-label="Close information">×</button>
      <h2 id="info-title" class="info-title">About the data</h2>
      <div id="info-body" class="info-body"></div>
    </div>
  </div>

  <header class="app-header">
    <div class="title-row">
      Aviation climate explorer
      <button id="info-btn" class="info-btn" type="button" aria-label="Show data and chart information" title="Data and chart information">i</button>
    </div>
    <div class="category-row" id="category-row">
      <div class="category-buttons" id="category-buttons"></div>
      <div class="mobile-control-strip" id="mobile-control-strip">
        <div class="mobile-selectors" id="mobile-selectors">
          <select id="mobile-section-select" class="mobile-select" aria-label="Select section"></select>
          <select id="mobile-chart-select" class="mobile-select" aria-label="Select chart"></select>
        </div>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="controls" id="controls">
      <label class="control">
        <span>Aerodrome</span>
        <select id="icao" aria-label="Aerodrome"></select>
      </label>

      <label class="control">
        <span>Season</span>
        <select id="season" aria-label="Season">
          <option value="all" selected>All seasons</option>
          <option value="summer">Summer</option>
          <option value="autumn">Autumn</option>
          <option value="winter">Winter</option>
          <option value="spring">Spring</option>
          <option value="tropical_wet">Tropical wet</option>
          <option value="tropical_dry">Tropical dry</option>
        </select>
      </label>

      <div class="control control-toggle">
        <span>Error bars (SD)</span>
        <button id="error-bars-toggle" type="button" class="error-bars-toggle" aria-pressed="false" aria-label="Error bars off" title="Error bars off (SD)">Error bars</button>
      </div>
    </section>

    <section class="status" id="status"></section>

    <section class="chart-grid" id="chart-grid">
      <article class="chart-card">
        <div class="chart-card-toolbar hidden" id="chart-toolbar-1"></div>
        <div class="chart" id="chart-1"></div>
      </article>
      <article class="chart-card">
        <div class="chart-card-toolbar hidden" id="chart-toolbar-2"></div>
        <div class="chart" id="chart-2"></div>
      </article>
      <article class="chart-card">
        <div class="chart-card-toolbar hidden" id="chart-toolbar-3"></div>
        <div class="chart" id="chart-3"></div>
      </article>
      <article class="chart-card">
        <div class="chart-card-toolbar hidden" id="chart-toolbar-4"></div>
        <div class="chart" id="chart-4"></div>
      </article>
    </section>

    <section class="metrics" id="metrics"></section>

    <div id="wr-toolbar-template" class="hidden">
      <div class="lite-control-row">
         <div class="segmented-toggle">
            <button id="wr-mode-summary" class="segmented-toggle-btn active" type="button">Daily Summary</button>
            <button id="wr-mode-hourly" class="segmented-toggle-btn" type="button">Hourly Profile</button>
         </div>

         <div class="lite-control-group hidden" id="wr-hour-scroller-container">
            <div class="hour-scroller-row">
               <button type="button" id="wr-hour-play" class="wr-hour-play-btn" aria-label="Play hourly wind rose animation" title="Play hourly animation">
                  <svg class="wr-hour-play-icon wr-hour-play-icon-play" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M4 2.5v11l9-5.5z"></path></svg>
                  <svg class="wr-hour-play-icon wr-hour-play-icon-pause" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M4 2h3v12H4zm5 0h3v12H9z"></path></svg>
               </button>
               <div class="frame-slider-shell">
                  <div class="frame-slider-base"></div>
                  <input type="range" id="wr-hour-scroller" class="frame-bound-slider" min="0" max="23" value="12">
               </div>
               <span id="wr-hour-value">12Z</span>
            </div>
         </div>
      </div>
    </div>

    <div id="lh-toolbar-template" class="hidden">
      <div class="lite-control-row">
         <div class="segmented-toggle">
            <button id="lh-mode-summary" class="segmented-toggle-btn active" type="button">Summary</button>
            <button id="lh-mode-hourly" class="segmented-toggle-btn" type="button">Hourly</button>
         </div>

         <div class="lite-control-group hidden" id="lh-hour-scroller-container">
            <div class="hour-scroller-row">
               <button type="button" id="lh-hour-play" class="hour-play-btn" aria-label="Play hourly lightning heatmap animation" title="Play hourly animation">
                  <svg class="hour-play-icon hour-play-icon-play" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M4 2.5v11l9-5.5z"></path></svg>
                  <svg class="hour-play-icon hour-play-icon-pause" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M4 2h3v12H4zm5 0h3v12H9z"></path></svg>
               </button>
               <div class="frame-slider-shell">
                  <div class="frame-slider-base"></div>
                  <input type="range" id="lh-hour-scroller" class="frame-bound-slider" min="0" max="23" value="12">
               </div>
               <span id="lh-hour-value">12Z</span>
            </div>
         </div>
      </div>
    </div>
  </main>

  <script src="app.js?v=__ASSET_VERSION__"></script>
</body>
</html>
